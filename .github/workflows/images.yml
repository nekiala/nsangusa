name: Build immutable images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        if: matrix.component == 'backend'
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: actions/setup-node@v4
        if: matrix.component == 'frontend'
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare backend artifact
        if: matrix.component == 'backend'
        run: |
          cd backend
          ./gradlew bootJar --no-daemon
          cp build/libs/news-platform-*.jar ../app.jar
      - name: Prepare frontend artifact
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run build
          cp -R .next/standalone ../standalone
          cp -R .next/static ../static
          mkdir -p ../public
          if [[ -d public ]]; then cp -R public/. ../public/; fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0
      - name: Sign published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"
      - name: Record deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-digests
          printf '%s\n' "$IMAGE_DIGEST" > "release-digests/${{ matrix.component }}.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-digest
          path: release-digests/${{ matrix.component }}.digest
          if-no-files-found: error

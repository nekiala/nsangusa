name: Build immutable images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality-gates.yml

  images:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.component == 'backend'
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.component == 'frontend'
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare backend artifact
        if: matrix.component == 'backend'
        run: |
          cd backend
          ./gradlew clean bootJar --no-daemon
          artifact_count="$(
            find build/libs -maxdepth 1 -type f \
              -name 'news-platform-*.jar' ! -name '*-plain.jar' \
              | wc -l | tr -d ' '
          )"
          if [[ "$artifact_count" -ne 1 ]]; then
            printf 'Expected exactly one executable backend jar, found %s\n' "$artifact_count" >&2
            find build/libs -maxdepth 1 -type f -name 'news-platform-*.jar' -print >&2
            exit 1
          fi
          artifact="$(
            find build/libs -maxdepth 1 -type f \
              -name 'news-platform-*.jar' ! -name '*-plain.jar' \
              -print -quit
          )"
          cp "$artifact" ../app.jar
      - name: Prepare frontend artifact
        if: matrix.component == 'frontend'
        run: |
          cd frontend
          npm ci
          npm run build
          cp -R .next/standalone ../standalone
          cp -R .next/static ../static
          mkdir -p ../public
          if [[ -d public ]]; then cp -R public/. ../public/; fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: json
          output: trivy-${{ matrix.component }}.json
      - name: Retain image scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-image-scan
          path: trivy-${{ matrix.component }}.json
          retention-days: 7
          if-no-files-found: error
      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "source-ref=$GITHUB_REF" \
            -a "source-commit=$GITHUB_SHA" \
            -a "quality-gate=passed" \
            "ghcr.io/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"
      - name: Record deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-digests
          printf '%s\n' "$IMAGE_DIGEST" > "release-digests/${{ matrix.component }}.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-digest
          path: release-digests/${{ matrix.component }}.digest
          if-no-files-found: error

name: Build test storage images

# MinIO no longer publishes images or binaries. This rebuilds the pinned server/client releases
# from unmodified upstream source for tests, local stacks and the test environment. Consumers
# pin the resulting digests; a push that changes the recipe never moves an existing reference.
on:
  push:
    paths:
      - infrastructure/docker/minio.Dockerfile
      - .github/workflows/storage-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: minio
            release: RELEASE.2025-04-22T22-12-26Z
          - component: mc
            release: RELEASE.2025-05-21T01-59-54Z
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infrastructure/docker/minio.Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ matrix.release }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.release }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: true
          sbom: true
      - name: Scan published image
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: json
          output: trivy-${{ matrix.component }}.json
      - name: Retain image scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-image-scan
          path: trivy-${{ matrix.component }}.json
          retention-days: 7
          if-no-files-found: error
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Sign published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "source-ref=$GITHUB_REF" \
            -a "source-commit=$GITHUB_SHA" \
            -a "upstream-release=${{ matrix.release }}" \
            "ghcr.io/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "ghcr.io/${{ github.repository }}/${{ matrix.component }}" "$IMAGE_DIGEST" \
            | tee "${{ matrix.component }}.ref"
          printf '### %s\n\n`%s`\n' "${{ matrix.component }}" "$(cat "${{ matrix.component }}.ref")" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-ref
          path: ${{ matrix.component }}.ref
          if-no-files-found: error

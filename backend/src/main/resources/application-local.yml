spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      file: ../infrastructure/compose/compose.yaml
      lifecycle-management: start-only
  jpa:
    show-sql: false

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger","traceId":"%X{traceId:-}","correlationId":"%X{correlationId:-}","message":"%replace(%m){''\"'',''\\\"''}"}%n'

news:
  providers:
    mode: fake
  storage:
    server-side-encryption: ${S3_SERVER_SIDE_ENCRYPTION:none}
  story:
    quiet-period: ${STORY_QUIET_PERIOD:PT3S}
    dispatch-interval: ${STORY_DISPATCH_INTERVAL:1000}
  local:
    seed: ${LOCAL_SEED:true}

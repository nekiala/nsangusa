  /api/v1/admin/ai-configuration/setup/credential:
    put:
      tags: [Articles]
      operationId: rotateAiProviderCredential
      summary: Store or rotate a write-only encrypted OpenAI API key
      description: |
        Requires deployment-managed AES-256-GCM master key. Never stores plaintext or calls OpenAI.
        Rotation disables live calls until explicit activation. Neither successful nor invalid
        responses echo credentials; durable request fingerprints contain only a credential digest.
        Replays do not rotate again and return current redacted setup status.
      x-required-roles: [ADMINISTRATOR]
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/AiSetupIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderCredentialRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiProviderSetupStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags: [Articles]
      operationId: removeAiProviderCredential
      summary: Remove encrypted credential material and block subsequent live calls
      description: Removal works even when the master key is unavailable. Does not revoke the key at OpenAI or rewrite drafts, images, or approvals. Replays return current redacted setup status.
      x-required-roles: [ADMINISTRATOR]
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/AiSetupIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiProviderSetupStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/admin/ai-configuration/setup/activate:
    post:
      tags: [Articles]
      operationId: activateAiProviderSetup
      summary: Explicitly activate the saved provider draft with audited outbound rights and cost acknowledgement
      description: |
        Checks both setup and editorial-selection versions. OpenAI additionally requires
        AI_LIVE_ENABLED, a decryptable credential, authorized settings, and explicit acknowledgement.
        Activation itself never calls OpenAI. Simulation is forbidden in production. Credentials,
        the operator gate, and changed authorization may block queued calls; there is no fake fallback.
        Successful actor-key replays are not re-executed and return current redacted setup status.
      x-required-roles: [ADMINISTRATOR]
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/AiSetupIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProviderActivationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiProviderSetupStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/admin/ai-configuration:
    get:
      tags:
      - Articles
      operationId: getAiAdministrationConfiguration
      summary: Read the active editorial generation selection
      description: |
        ADMINISTRATOR only. Version zero represents the operator-deployed default and
        has null changedBy/changedAt. New AI requests snapshot the selected configuration;
        existing requests, drafts, approvals, and images are not rewritten.
      x-required-roles:
      - ADMINISTRATOR
      responses:
        '200':
          description: Active selection, including secret reference metadata but never credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4AiConfigurationView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      tags:
      - Articles
      operationId: selectAiAdministrationConfiguration
      summary: Version and audit a deployed provider, authorized model, and immutable prompt selection
      description: |
        ADMINISTRATOR only. The provider and model must occur in the current deployed
        catalog, and promptVersion must already exist. One model selection applies to
        analysis, drafting, and the content-safety gate. Editable guidance is never sent
        to the safety gate. Capabilities, credentials, secret bindings, endpoints, tools,
        budgets, timeouts, system rules, and publication policy cannot be supplied here.
        Idempotency-Key is mandatory, unlike legacy optional-key mutations elsewhere.
        Successful retries return the original immutable configuration version, even if
        another configuration has subsequently been selected. Authorization precedes replay.
        Provider-type changes must use the setup draft and activation workflow. An already
        activated OpenAI selection can change approved models/prompts while preserving its bounds.
      x-required-roles:
      - ADMINISTRATOR
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - name: Idempotency-Key
        in: header
        required: true
        description: Required actor-scoped key; a changed payload or operation with the same key returns 409.
        schema:
          type: string
          minLength: 8
          maxLength: 200
          pattern: ^[!-~]{8,200}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4AiSelectionRequest'
      responses:
        '200':
          description: The newly selected version or the original successful actor-key receipt's version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4AiConfigurationView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The selected immutable prompt version does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'

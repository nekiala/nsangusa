---
openapi: 3.1.0
info:
  title: Nsangusa API
  version: 1.0.0
  description: Static language-neutral contract for implemented Spring MVC routes.
    Spring Security supplies the explicitly marked login and logout operations.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.example.invalid
  description: Placeholder; configure per environment
tags:
- name: Identity
  description: Registration, authentication, account lifecycle, and session management.
- name: Articles
  description: Public article retrieval and protected editorial lifecycle operations.
- name: Comments
  description: Reader comments, abuse reporting, moderation, and comment policy.
- name: Newsletter
  description: Subscription consent, preferences, delivery records, and provider callbacks.
- name: Search
  description: Full-text article search and topic or tag discovery.
- name: Sources
  description: Monitored X accounts, source records, exclusions, and compliance actions.
- name: Media
  description: Editorial image generation, approval, regeneration, and asset removal.
- name: Operations
  description: Health summaries, failed-event inspection, and controlled replay.
security:
- sessionCookie: []
- basicAuth: []
paths:
  "/api/v1/auth/csrf":
    get:
      tags:
      - Identity
      operationId: getCsrfToken
      summary: Issue the CSRF cookie and return its request-header value
      security: []
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfTokenResponse"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/auth/register":
    post:
      tags:
      - Identity
      operationId: register
      summary: Request an account requiring email verification
      description: >
        Returns the same accepted response for a new or already registered address, without disclosing an account
        identifier. A new registration sends a real verification email. Existing accounts are not modified; use
        the verification request operation to request another verification link.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityRegistrationRequest'
      responses:
        '202':
          description: Registration request accepted without disclosing account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4IdentityRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/login":
    post:
      tags:
      - Identity
      operationId: login
      summary: Authenticate using Spring Security form login
      security: []
      x-framework-provided: spring-security
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authentication succeeded and a session was established
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/logout":
    post:
      tags:
      - Identity
      operationId: logout
      summary: Invalidate the current browser session without redirecting
      x-framework-provided: spring-security
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Current session invalidated; SESSION and JSESSIONID cookies removed.
          headers:
            Set-Cookie:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/verify-email":
    post:
      tags:
      - Identity
      operationId: verifyEmail
      summary: Explicitly consume a single-use email-verification token
      description: >
        Only POST consumes the token. Missing, malformed, expired, previously consumed or wrong-purpose tokens are
        rejected. Token consumption is serialized in PostgreSQL. The default verification lifetime is 30 minutes
        and is configurable. Newsletter account linking occurs only after email verification.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityTokenRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/password-reset/request":
    post:
      tags:
      - Identity
      operationId: requestPasswordReset
      summary: Request a short-lived password-reset email
      description: >
        Returns an accepted response without disclosing account existence. Only enabled, non-deleted accounts
        receive mail. Issuing a new token invalidates earlier reset tokens for the account. The default lifetime
        is 15 minutes and is configurable.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityEmailRequest'
      responses:
        '202':
          description: Password-reset request accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/password-reset/confirm":
    post:
      tags:
      - Identity
      operationId: confirmPasswordReset
      summary: Explicitly consume a reset token and replace the password
      description: >
        Hashes the new password with the configured Argon2id encoder, clears login lockout tracking and revokes
        existing sessions after commit. A persistent security stamp prevents older authenticated sessions or a
        concurrent login using the old password from remaining authorized if Redis cleanup fails. GET does not
        consume the token.
      security: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityPasswordResetConfirm'
      responses:
        '204':
          description: Password replaced and previous authentication invalidated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/me":
    get:
      tags:
      - Identity
      operationId: getCurrentUser
      summary: Read the currently authenticated account and its profile version
      description: Account identity is derived from the authenticated principal, never a supplied actor identifier.
      responses:
        '200':
          description: Current account; the response must not be publicly cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4IdentityUserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    patch:
      tags:
      - Identity
      operationId: updateCurrentUser
      summary: Update profile fields using the version actually loaded
      description: >
        Requires the current account version, including preference-only updates. Display names are trimmed and
        must remain nonblank. A newsletter frequency update requires an active linked subscription and does not
        grant consent or confirm a pending subscription. The legacy instant input is normalized to immediate.
        Stale versions return 409; successful changes are audited.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityProfileUpdate'
      responses:
        '200':
          description: Updated current profile with its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4IdentityUserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
      - Identity
      operationId: deleteCurrentUser
      summary: Confirm and anonymize the current account using its loaded version
      description: >
        Disables local sign-in, clears roles, anonymizes email and display name, removes verification/reset tokens
        and linked external identities, unsubscribes and unlinks the newsletter, and invalidates sessions.
        Required audit/consent records and published contributions may be retained; this is not a claim of
        cross-store or backup erasure. The last active administrator cannot delete their account. Deletion and
        administrator changes share a transaction lock.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityAccountDeletion'
      responses:
        '204':
          description: Account anonymized and sign-in invalidated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/me/export":
    get:
      tags:
      - Identity
      operationId: exportCurrentUserData
      summary: Download the current account's identity-data export
      description: >
        Includes the current profile, linked newsletter preference and external identity links. Does not contain
        password hashes or verification/reset tokens. Does not export published content, audit records or other
        modules' retained operational data. Export is audited.
      responses:
        '200':
          description: Scoped account-data export.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Content-Disposition:
              schema:
                type: string
                const: attachment; filename="account-data.json"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4IdentityAccountExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/sessions":
    get:
      tags:
      - Identity
      operationId: listCurrentUserSessions
      summary: List sessions indexed to the current account
      description: >
        Uses the Redis indexed session repository and sorts most recently accessed first. Marks the calling
        browser session as current. Session-store absence is an error, not an empty success response.
      responses:
        '200':
          description: Sessions belonging to the authenticated account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Phase4IdentitySession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/auth/sessions/{sessionId}":
    delete:
      tags:
      - Identity
      operationId: revokeCurrentUserSession
      summary: Revoke one session owned by the current account
      description: >
        Rejects an unknown session or a session belonging to another account. Revoking the current session also
        invalidates the current servlet session. Successful revocation is audited.
      parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Selected session revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/articles":
    get:
      tags:
      - Articles
      operationId: listLatestArticles
      summary: List the latest published articles using the legacy array response
      description: >
        Returns only PUBLISHED articles, ordered by publishedAt descending and id ascending. The limit is clamped
        to 1 through 100 rather than rejected. Use /api/v1/articles/discovery for lightweight, total-aware
        pagination.
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: At most 100 published full article views.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/articles/{slug}":
    get:
      tags:
      - Articles
      operationId: getPublishedArticle
      summary: Get a published article by slug
      security: []
      parameters:
      - "$ref": "#/components/parameters/Slug"
      responses:
        '200':
          description: Published article
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Article"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles":
    get:
      tags: [Articles]
      operationId: listEditorialArticles
      summary: Page through articles for editorial review
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/WorkspacePage"
      - "$ref": "#/components/parameters/WorkspaceSize"
      - name: state
        in: query
        schema:
          "$ref": "#/components/schemas/ArticleState"
      responses:
        '200':
          description: Current article queue, never publicly cached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ArticlePage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/UnexpectedError"
    post:
      tags:
      - Articles
      operationId: createManualArticle
      summary: Create a sourced article for editorial review
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArticleCommandRequest"
      responses:
        '201':
          description: Article created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IdResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/articles/{slug}/image":
    get:
      tags: [Media]
      operationId: getPublishedArticleImage
      summary: Serve a selected illustration only for a published article
      security: []
      parameters:
      - "$ref": "#/components/parameters/Slug"
      - "$ref": "#/components/parameters/ImageVariant"
      responses:
        '200':
          description: Optimized image bytes; no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          description: No published article or selected image
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/image-generations/{generationId}/content":
    get:
      tags: [Media]
      operationId: previewEditorialImage
      summary: Preview an image candidate without making it public
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/GenerationId"
      - "$ref": "#/components/parameters/ImageVariant"
      responses:
        '200':
          description: Private optimized preview; no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          description: Image candidate or stored variant not found
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/story-candidates":
    get:
      tags: [Articles]
      operationId: listStoryCandidates
      summary: Page through candidates with their sources and generated article identifiers
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/WorkspacePage"
      - "$ref": "#/components/parameters/WorkspaceSize"
      responses:
        '200':
          description: Private story candidate queue
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StoryPage"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/story-candidates/{id}/regenerate":
    post:
      tags: [Articles]
      operationId: regenerateStoryCandidate
      summary: Create a new candidate from still-eligible sources without changing existing articles
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '202':
          description: New candidate queued for analysis and review
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IdResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/ai-requests":
    get:
      tags:
      - Articles
      operationId: inspectEditorialAnalysis
      summary: Inspect persisted analysis, drafts, safety decisions, and snapshotted generation configuration
      description: |
        The top-level model is the provider-reported model, which may be a resolved
        version of the requested alias. configuration.model is the snapshotted requested
        model. Configuration snapshots persist across retries and subsequent admin
        changes. Historical attempts predating snapshots return configuration=null.
        This existing provenance endpoint remains available to EDITOR and ADMINISTRATOR.
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - name: storyCandidateId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Up to 100 newest private generation attempts and validated results
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Phase4AiRequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/admin/articles/{id}/revisions":
    get:
      tags: [Articles]
      operationId: listArticleRevisions
      summary: Inspect full immutable revision snapshots; unavailable older snapshots are explicitly marked
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/WorkspacePage"
      - "$ref": "#/components/parameters/WorkspaceSize"
      responses:
        '200':
          description: Private paginated revision history
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RevisionPage"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/revisions/compare":
    get:
      tags: [Articles]
      operationId: compareArticleRevisions
      summary: Compare two stored article revisions
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/Id"
      - name: from
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      - name: to
        in: query
        required: true
        schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Both snapshots and all changed top-level fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RevisionComparison"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/corrections":
    post:
      tags: [Articles]
      operationId: startArticleCorrection
      summary: Withdraw a previously published article and begin a correction requiring renewed approval
      description: Preserves canonical identity and original publication time. Republishing the approved correction does not trigger another newsletter.
      x-required-roles: [EDITOR, ADMINISTRATOR]
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, note]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
                note: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '204':
          description: Article withdrawn and correction revision created
        '409':
          "$ref": "#/components/responses/Conflict"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}":
    get:
      tags:
      - Articles
      operationId: getAdminArticle
      summary: Get an article for editorial review
      x-required-roles:
      - EDITOR

  /api/v1/newsletter/admin/deliveries/{id}/reconciliation:
    post:
      tags:
      - Newsletter
      operationId: phase4NewsletterReconcileDelivery
      summary: Record evidence-backed terminal reconciliation without resending
      description: >
        ADMINISTRATOR only; CSRF and Idempotency-Key are required. Accepts a reconciliation_required or failed
        reservation, or a pending attempt older than the configured attempt lease (ten minutes by default).
        Locks the reservation and atomically commits the audit, operator evidence and command receipt. Every
        outcome sets terminal status reconciled and prevents further sends, including not_sent. Provider
        acceptance requires a provider message identifier but remains an operator assertion, not automated
        verification. An unchanged actor/key request replays successfully; changed request content conflicts.
        Authorization precedes replay.
      x-required-roles:
      - ADMINISTRATOR
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Phase4NewsletterMutationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4NewsletterReconciliationRequest'
      responses:
        '204':
          description: Reconciliation durably recorded or replayed. No email was resent.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Delivery reservation not found.

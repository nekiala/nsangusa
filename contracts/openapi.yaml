          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/admin/commenting-users:
    get:
      tags:
      - Comments
      operationId: phase4CommunitySearchAccounts
      summary: Find active community accounts without manually entering identifiers
      description: >
        Requires MODERATOR or ADMINISTRATOR, rechecked by the public identity service. A trimmed,
        case-insensitive display-name or email search of 2-100 characters is required. Only enabled,
        email-verified, nondeleted accounts are returned. Results are ordered by display name then identifier.
        At most 20 accounts are returned; refine the query when necessary. Email addresses, role sets, and
        authentication details are not exposed by the result DTO.
      x-required-roles:
      - MODERATOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Trimmed query must contain 2-100 characters.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 20
      responses:
        '200':
          description: Bounded active-account search results; no email addresses.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Phase4CommunityAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /api/v1/admin/commenting-users/{userId}:
    get:
      tags:
      - Comments
      operationId: phase4CommunityAccountDetail
      summary: Resolve a discovered comment author's safe account label
      description: >
        Requires MODERATOR or ADMINISTRATOR, rechecked by the identity service. Unlike account search, direct
        lookup may return inactive accounts. A deleted account's display name is replaced with Deleted user.
        Changing commenting privileges does not reactivate an inactive account or change its identity roles.
      x-required-roles:
      - MODERATOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Safe account label and effective activity flag.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4CommunityAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Account not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Redis-backed opaque Spring Session cookie
    basicAuth:
      type: http
      scheme: basic
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Actor-scoped retry key. Reusing a key with another target or payload returns 409. Success receipts and domain/outbox state commit together; absent keys retain legacy execution.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: '^[!-~]{8,200}$'
    AiSetupIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Actor-scoped durable key; reuse with changed payload or operation returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[!-~]{8,200}$
    ReviewedVersion:
      name: expectedVersion
      in: query
      required: false
      description: Version actually reviewed by the editor. A stale version is rejected before the transition; legacy callers may omit it.
      schema:
        type: integer
        format: int64
        minimum: 0
    WorkspacePage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    WorkspaceSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ImageVariant:
      name: variant
      in: query
      schema:
        type: string
        enum: [hero, thumbnail, social]
        default: hero
    Id:
      name: id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 250
    Topic:
      name: topic
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    SourceAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[0-9]{1,30}$"
        maxLength: 30
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Spring Security CSRF token matching the XSRF-TOKEN cookie
      schema:
        type: string
        minLength: 1
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        format: int64
    ArticleLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
    LimitedListSize:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    SubscriptionId:
      name: id
      in: query
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    SubscriptionToken:
      name: token
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    SvixId:
      name: svix-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    SvixTimestamp:
      name: svix-timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: "^[0-9]+$"
    SvixSignature:
      name: svix-signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    DeliveryLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
    IncludeRemoved:
      name: includeRemoved
      in: query
      required: false
      schema:
        type: boolean
        default: false
    SourceAccountFilter:
      name: accountId
      in: query
      required: false
      schema:
        type: string
    SourceStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
    SourceLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
    FailedEventStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
    FailedEventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: Invalid path, query, header, or request-body input
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    AiProviderSetupStatus:
      description: Current redacted setup status; never credential material or a connectivity result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiProviderSetupStatus'
    Unauthorized:
      description: Authentication is required or failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: Authentication succeeded but authorization or CSRF validation failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: The requested transition conflicts with current resource state
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    TooManyRequests:
      description: Per-client request rate exceeded
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds
    ServiceUnavailable:
      description: Rate limiting could not reach its Redis dependency
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    UnexpectedError:
      description: Unexpected API failure
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    Identifier:
      type: string
      format: uuid
    IdResponse:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          "$ref": "#/components/schemas/Identifier"
    EventResponse:
      type: object
      additionalProperties: false
      required:
      - eventId
      properties:
        eventId:
          "$ref": "#/components/schemas/Identifier"
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required:
      - headerName
      - token
      properties:
        headerName:
          type: string
        token:
          type: string
    Problem:
      type: object
      additionalProperties: true
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    RegistrationResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id:
          "$ref": "#/components/schemas/Identifier"
        status:
          type: string
          const: verification_required
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
        newsletterFrequency:
          type:
          - string
          - 'null'
          enum:
          - instant
          - daily
          - weekly
          - null
    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required:
      - confirmation
      properties:
        confirmation:
          type: string
          const: DELETE
    NewsletterPreference:
      type: object
      additionalProperties: false
      required:
      - subscriptionId
      - status
      - frequency
      properties:
        subscriptionId:
          oneOf:
          - "$ref": "#/components/schemas/Identifier"
          - type: 'null'
        status:
          type:
          - string
          - 'null'
        frequency:
          type:
          - string
          - 'null'
    UserProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - displayName
      - roles
      - emailVerified
      - createdAt
      - lastLoginAt
      - newsletter
      properties:
        id:
          "$ref": "#/components/schemas/Identifier"
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        newsletter:
          oneOf:
          - "$ref": "#/components/schemas/NewsletterPreference"
          - type: 'null'
    ExternalIdentity:
      type: object
      additionalProperties: false
      required:
      - issuer
      - subject
      - emailAtLink
      - linkedAt
      - lastLoginAt
      properties:
        issuer:
          type: string
        subject:
          type: string
        emailAtLink:
          type: string
          format: email
        linkedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
    AccountDataExport:
      type: object
      additionalProperties: false
      required:
      - generatedAt
      - profile
      - externalIdentities
      properties:
        generatedAt:
          type: string
          format: date-time
        profile:
          "$ref": "#/components/schemas/UserProfile"
        externalIdentities:
          type: array
          items:
            "$ref": "#/components/schemas/ExternalIdentity"
    UserSession:
      type: object
      additionalProperties: false
      required:
      - id
      - createdAt
      - lastAccessedAt
      - expiresAt
      - current
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastAccessedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    ArticleState:
      type: string
      enum:
      - DISCOVERED
      - ANALYZING
      - DRAFTING
      - AWAITING_REVIEW
      - APPROVED
      - SCHEDULED
      - PUBLISHED
      - UNPUBLISHED
      - REJECTED
      - ARCHIVED
    ArticleSource:
      type: object
      additionalProperties: false
      required:
      - sourcePostId
      - account
      - postId
      - url
      - publishedAt
      properties:
        sourcePostId:
          "$ref": "#/components/schemas/Identifier"
        account:
          type: string
        postId:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
    ScheduleView:
      type: object
      additionalProperties: false
      required: [id, articleId, publishAt, status, version, articleVersion, scheduledBy, updatedBy, createdAt, updatedAt, completedAt, lastAttemptAt, attemptCount, lastError]
      properties:
        id: {type: string, format: uuid}
        articleId: {type: string, format: uuid}
        publishAt: {type: string, format: date-time}
        status: {type: string, enum: [scheduled, failed, published, cancelled]}
        version: {type: integer, format: int64, minimum: 0}
        articleVersion: {type: [integer, 'null'], format: int64, minimum: 0}
        scheduledBy: {type: string, format: uuid}
        updatedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        attemptCount: {type: integer, minimum: 0}
        lastError: {type: [string, 'null'], maxLength: 1000}
    SchedulePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {"$ref": "#/components/schemas/ScheduleView"}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    PublicationPolicy:
      type: object
      additionalProperties: false
      required: [policy, confidenceThreshold, topicRules, approvedSourceAccounts, humanPublicationAllowed, explanation]
      properties:
        policy:
          type: string
          enum: [HUMAN_REVIEW_ALWAYS, CONFIDENCE_THRESHOLD, APPROVED_SOURCE_ONLY, DRAFT_GENERATION_ONLY, TOPIC_RULES]
        confidenceThreshold: {type: number, minimum: 0, maximum: 1}
        topicRules:
          type: object
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        approvedSourceAccounts: {type: array, items: {type: string}}
        humanPublicationAllowed: {type: boolean}
        explanation: {type: string}
    RevisionSnapshot:
      type: object
      additionalProperties: false
      required: [slug, headline, summary, body, editorialContext, seoTitle, seoDescription, topic, tags, sources, heroObjectKey, imageAltText, generatedImage, approvedImageGenerationId, pendingImageGenerationId, imageApprovalRequired, commentsEnabled, state, humanReviewRequired, confidence, warnings, correctionNote, approvedBy, approvedAt, publishedAt, updatedAt]
      properties:
        slug: {type: string}
        headline: {type: string}
        summary: {type: string}
        body: {type: string}
        content:
          description: Stored structured content, or null for a historical snapshot without structured content.
          anyOf:
          - "$ref": "#/components/schemas/ArticleContent"
          - type: 'null'
        editorialContext: {type: [string, 'null']}
        seoTitle: {type: string}
        seoDescription: {type: string}
        topic: {type: string}
        tags: {type: array, items: {type: string}}
        sources:
          type: array
          items: {"$ref": "#/components/schemas/ArticleSource"}
        heroObjectKey: {type: [string, 'null']}
        imageAltText: {type: [string, 'null']}
        generatedImage: {type: boolean}
        approvedImageGenerationId: {type: [string, 'null'], format: uuid}
        pendingImageGenerationId: {type: [string, 'null'], format: uuid}
        imageApprovalRequired: {type: boolean}
        commentsEnabled: {type: boolean}
        state: {"$ref": "#/components/schemas/ArticleState"}
        humanReviewRequired: {type: boolean}
        confidence: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, items: {type: string}}
        correctionNote: {type: [string, 'null'], maxLength: 2000}
        approvedBy: {type: [string, 'null'], format: uuid}
        approvedAt: {type: [string, 'null'], format: date-time}
        publishedAt: {type: [string, 'null'], format: date-time}
        updatedAt: {type: string, format: date-time}
    RevisionView:
      type: object
      additionalProperties: false
      required: [id, revisionNumber, reason, actorId, createdAt, headline, summary, body, snapshot, aiGenerationResult, legacy]
      properties:
        id: {"$ref": "#/components/schemas/Identifier"}
        revisionNumber: {type: integer, minimum: 1}
        reason: {type: string}
        actorId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
        headline: {type: string}
        summary: {type: string}
        body: {type: string}
        snapshot:
          oneOf:
          - "$ref": "#/components/schemas/RevisionSnapshot"
          - {type: 'null'}
        aiGenerationResult:
          type: [object, 'null']
          description: Original validated ArticleDraftGenerated evidence when retained for this revision.
        legacy:
          type: boolean
          description: True when the full snapshot is unavailable (older writer or source redaction); missing values are not reconstructed.
    RevisionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {"$ref": "#/components/schemas/RevisionView"}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    RevisionComparison:
      type: object
      additionalProperties: false
      required: [from, to, changedFields]
      properties:
        from: {"$ref": "#/components/schemas/RevisionView"}
        to: {"$ref": "#/components/schemas/RevisionView"}
        changedFields: {type: array, items: {type: string}}
    ArticlePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Article"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    StoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/StoryView"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    StoryView:
      type: object
      additionalProperties: false
      required: [id, topic, status, createdAt, sourceIds, articleId]
      properties:
        id:
          "$ref": "#/components/schemas/Identifier"
        topic:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        sourceIds:
          type: array
          items:
            "$ref": "#/components/schemas/Identifier"
        articleId:
          type: [string, 'null']
          format: uuid
    AiRequestView:
      type: object
      additionalProperties: false
      required: [id, storyCandidateId, operation, provider, model, promptVersion, status, errorCode, createdAt, completedAt, inputTokens, outputTokens, result]
      properties:
        id:
          "$ref": "#/components/schemas/Identifier"
        storyCandidateId:
          "$ref": "#/components/schemas/Identifier"
        operation:
          type: string
        provider:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        status:
          type: string
        errorCode:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        result:
          type: [object, 'null']
          description: Validated analysis or draft for the operation; null for incomplete, failed, safety-only or source-redacted attempts.
    Article:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - headline
      - summary
      - body
      - editorialContext
      - topic
      - tags
      - state
      - heroObjectKey
      - imageAltText
      - generatedImage
      - commentsEnabled
      - publishedAt
      - updatedAt
      - version
      - sources
      - warnings
      - confidence
      - storyCandidateId
      - seoTitle
      - seoDescription
      - approvedImageGenerationId
      - pendingImageGenerationId

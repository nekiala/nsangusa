  "/api/v1/search":
    get:
      tags:
      - Search
      operationId: searchArticles
      summary: Search published articles using full-text ranking
      description: >
        Uses PostgreSQL English websearch_to_tsquery ranking. Search documents are joined to authoritative article
        rows and only PUBLISHED articles with a non-null publishedAt contribute results or totals. Orders rank
        descending, publishedAt descending, then articleId ascending. Search projection updates remain synchronous
        with visibility changes.
      security: []
      parameters:
      - name: q
        in: query
        required: true
        description: >
          Trimmed before validation. The trimmed value must have 1 through 200 characters; whitespace-only queries
          are rejected.
        schema:
          type: string
          minLength: 1
          pattern: \S
      - name: page
        in: query
        schema:
          $ref: '#/components/schemas/Phase4PublicSearchPageNumber'
      - $ref: '#/components/parameters/WorkspaceSize'
      responses:
        '200':
          description: Ranked summaries with the current matching total.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4PublicSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

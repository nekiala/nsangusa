    ArticleContent:
      type: object
      additionalProperties: false
      description: Versioned safe blocks. Java derives the canonical plain body, bounded to 100000 characters including block/list delimiters and link URLs. The aggregate bound and URI host/port validation are additionally enforced by the runtime, not expressible as a sum in JSON Schema. Raw HTML and embeds are not interpreted.
      required: [version, blocks]
      properties:
        version: {type: integer, const: 1}
        blocks:
          type: array
          minItems: 1
          maxItems: 200
          items:
            "$ref": "#/components/schemas/ArticleContentBlock"
    ArticleContentBlock:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [paragraph, heading, quote, unordered_list, ordered_list, link]}
        text: {type: [string, 'null'], maxLength: 100000, pattern: '\S'}
        url:
          type: [string, 'null']
          maxLength: 2048
          description: Links must be absolute HTTP(S) without user information or control characters. Other blocks must omit this field or use null.
        items:
          type: [array, 'null']
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 100000, pattern: '\S'}
      oneOf:
      - required: [text]
        properties:
          type: {enum: [paragraph, heading, quote]}
          text: {type: string, minLength: 1}
          url: {type: 'null'}
          items: {type: 'null'}
      - required: [items]
        properties:
          type: {enum: [unordered_list, ordered_list]}
          items: {type: array, minItems: 1}
          text: {type: 'null'}
          url: {type: 'null'}
      - required: [text, url]
        properties:
          type: {const: link}
          text: {type: string, minLength: 1}
          url:
            type: string
            format: uri
            pattern: '^[Hh][Tt][Tt][Pp][Ss]?://(?![^/?#]*@)[^/?#\s\\]+(?:[/?#][^\s\\]*)?$'
            not:
              pattern: '[\u0000-\u0020\u007f\\]|%([01][0-9a-fA-F]|7[fF])'
          items: {type: 'null'}
    ArticleCommandRequest:
      type: object
      additionalProperties: false
      anyOf:
      - required: [body]
        properties:
          body: {type: string, minLength: 1, pattern: '\S'}
      - required: [content]
        properties:

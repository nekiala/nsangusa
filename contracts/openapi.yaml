      type: integer
      format: int64
      minimum: 0
      description: Current persisted comment version; stale values are rejected with 409.
    Phase4CommunityOptionalRowVersion:
      type: integer
      format: int64
      minimum: -1
      description: >
        -1 denotes an absent global-policy, article-policy, or privilege row. Use the version returned by the
        corresponding GET. The first persisted row has version 0.
    Phase4CommunityCommentState:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - spam
      - deleted
    Phase4CommunityDecision:
      type: string
      enum:
      - approved
      - rejected
      - spam
      - deleted
    Phase4CommunityReportReason:
      type: string
      enum:
      - abuse
      - harassment
      - hate
      - misinformation
      - spam
      - other
    Phase4CommunityPlainBody:
      type: string
      minLength: 1
      maxLength: 5000
      pattern: ^(?=[\s\S]*\S)[^<>]+$
      description: Nonblank plain text; angle brackets are rejected and surrounding whitespace is trimmed.
    Phase4CommunityRequiredReason:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: \S
      description: Nonblank reason. Stored text is trimmed and must be rendered as text, not HTML.
    Phase4CommunityComment:
      type: object
      additionalProperties: false
      required:
      - id
      - authorId
      - authorName
      - body
      - parentId
      - state
      - createdAt
      - editedAt
      - deletedByAuthor
      - deleted
      - version
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        authorId:
          $ref: '#/components/schemas/Identifier'
        authorName:
          type: string
          description: Safe display name from the identity service, with deleted-account or missing-name fallback.
        body:
          type: string
          maxLength: 5000
          description: Plain comment text or an irreversible deletion marker.
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        state:
          $ref: '#/components/schemas/Phase4CommunityCommentState'
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - 'null'
          format: date-time
        deletedByAuthor:
          type: boolean
        deleted:
          type: boolean
          description: >-
            True when text was deleted by its author or a moderator; an author tombstone may still have approved
            state.
        version:
          $ref: '#/components/schemas/Phase4CommunityExistingVersion'
    Phase4CommunityDiscussion:
      type: object
      additionalProperties: false
      required:
      - comments
      - viewerId
      - authenticated
      - eligible
      - enabled
      - requireApproval
      - editingWindowMinutes
      - maximumReplyDepth
      - privilegeStatus
      - suspendedUntil
      - canComment
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Phase4CommunityComment'
          description: Publicly visible comments plus this viewer's own nonpublic comments; empty when enabled is false.
        viewerId:
          type:
          - string
          - 'null'
          format: uuid
        authenticated:
          type: boolean
        eligible:
          type: boolean
          description: >-
            True for an email-verified authenticated profile with READER, MODERATOR, EDITOR, or ADMINISTRATOR
            role.
        enabled:
          type: boolean
          description: Effective conjunction of published state and global/article/per-article availability switches.
        requireApproval:
          type: boolean
        editingWindowMinutes:
          type: integer
          minimum: 0
          maximum: 10080
        maximumReplyDepth:
          type: integer
          const: 1
        privilegeStatus:
          type: string
          enum:
          - allowed
          - suspended
        suspendedUntil:
          type:
          - string
          - 'null'
          format: date-time
          description: Null for no recorded timed suspension or an indefinite suspension; may retain an expired timestamp.
        canComment:
          type: boolean
          description: Authenticated, eligible, enabled, and not currently suspended.

  /api/v1/admin/users/{id}/roles:
    put:
      tags:
      - Identity
      operationId: replaceIdentityUserRoles
      summary: Confirm a versioned replacement of another account's allowed roles
      x-required-roles:
      - ADMINISTRATOR
      description: >
        Requires a durable actor-scoped request key, the loaded user version and an exact copy of the selected
        account's email as confirmation. Replaces the complete role set. Administrators cannot change their own
        roles. The target must be enabled, verified and non-deleted; the last active administrator cannot be
        removed. Actor identity comes from the authenticated principal. Authorization is rechecked before
        receipt lookup, including retries. Identical actor/key/target/version/payload retries return 204 without
        a second mutation or audit. Reusing the same key for a different payload returns 409. Role order is
        canonicalized before fingerprinting. Successful changes are audited, revoke target sessions after commit
        and change a persistent security stamp. Locally managed roles are not restored from external-provider
        claims on later login.
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CsrfToken'
      - name: Idempotency-Key
        in: header
        required: true
        description: Unlike legacy editorial operations, this operation requires a request key.
        schema:
          type: string
          minLength: 8
          maxLength: 200
          pattern: ^[!-~]{8,200}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4IdentityRoleChange'
      responses:
        '204':
          description: Roles replaced, or the same successful command replayed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Consent confirmed, or the same confirmation was already completed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/newsletter/unsubscribe":
    post:
      tags:
      - Newsletter
      operationId: unsubscribeNewsletter
      summary: Withdraw newsletter consent using the dedicated unsubscribe token
      description: >
        Public token-authorized POST used by both the explicit browser control and List-Unsubscribe one-click
        requests. This endpoint is narrowly exempt from CSRF; other newsletter browser mutations are not. GET is
        unsupported. Repeated valid requests are idempotent. Suppression remains in force. The unsubscribe token
        cannot authorize frequency changes.
      security: []
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - $ref: '#/components/parameters/SubscriptionToken'
      requestBody:
        required: false
        description: Optional RFC 8058 one-click form body; authorization remains in the query token.
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
                  const: One-Click
      responses:
        '204':
          description: Newsletter consent withdrawn without removing an existing suppression.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/newsletter/preferences":
    post:
      tags:
      - Newsletter
      operationId: updateNewsletterPreferences
      summary: Explicitly change frequency using an expiring preference-scoped token
      description: >
        Requires confirmed consent, the emailed management authorization, CSRF and a durable mutation key.
        Authorization is checked before command replay. A changed payload with the same key conflicts. Frequency
        changes are audited and recorded in consent history. This operation never confirms, resubscribes or
        unsuppresses an address. Unlike the former operation, an unsubscribe token is not sufficient.
      security: []
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - name: token
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Phase4NewsletterPreferenceToken'
      - $ref: '#/components/parameters/CsrfToken'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/Phase4NewsletterMutationKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4NewsletterPreferenceRequest'
      responses:
        '204':
          description: Frequency updated, or the same authorized mutation was already committed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The private preference link is invalid, expired or no longer authorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    get:
      tags:
      - Newsletter
      operationId: phase4NewsletterReadPreferences
      summary: Read preferences using a private expiring email authorization
      description: >
        Unauthenticated subscribers can use this endpoint. The response contains no address, address hash, account
        identity or bearer token. Reading neither changes consent nor consumes the authorization. Invalid,
        expired, wrong-scope and revoked authorizations all return 410. Unsubscribe tokens are not accepted.
      security: []
      parameters:
      - $ref: '#/components/parameters/SubscriptionId'
      - name: token
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Phase4NewsletterPreferenceToken'
      responses:
        '200':
          description: Authorized current preference and authorization expiry.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Referrer-Policy:
              schema:
                type: string
                const: no-referrer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase4NewsletterPreferenceView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          description: The private preference link is invalid, expired or no longer authorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/newsletter/provider-webhooks/{provider}":
    post:
      tags:
      - Newsletter
      operationId: processNewsletterProviderWebhook
      summary: Verify and deduplicate a configured email-provider callback
      description: >
        Verifies the raw body before parsing. Resend requires valid Svix headers with a timestamp within five
        minutes; the explicitly configured local legacy provider uses X-Webhook-Signature HMAC. The path provider
        must match configuration. Repeated external event IDs are ignored. Bounce and complaint callbacks preserve
        suppression. Only a signed delivery callback matched by provider message ID can establish
        deliveryConfirmedAt; SMTP acceptance alone never does. Delivery callbacks without a message identifier are
        rejected. Provider-specific SMTP/callback correlation still requires production qualification.
      security: []
      parameters:
      - $ref: '#/components/parameters/Provider'
      - name: svix-id
        in: header
        description: Required when the configured provider is resend.
        schema:
          type: string
      - name: svix-timestamp
        in: header
        description: Required for resend; Unix seconds within the five-minute tolerance.
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: svix-signature
        in: header
        description: Required for resend; one or more versioned Svix signatures.
        schema:
          type: string
      - name: X-Webhook-Signature
        in: header
        description: Required for the explicitly configured local legacy webhook format.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
          text/plain:
            schema:
              type: string
      responses:
        '204':
          description: Verified callback processed, or the same external event was already recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/newsletter/admin/deliveries":
    get:
      tags:
      - Newsletter
      operationId: listNewsletterDeliveries
      summary: Read the bounded legacy delivery list
      description: >
        ADMINISTRATOR only. The limit is clamped to 1 through 100. Prefer the pageable delivery-history operation
        for full operational detail. Historical stored delivered rows are returned as provider_accepted, or
        delivery_confirmed only when a signed delivery callback was recorded.

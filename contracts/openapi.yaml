---
openapi: 3.1.0
info:
  title: Nsangusa API
  version: 1.0.0
  description: Static language-neutral contract for implemented Spring MVC routes.
    Spring Security supplies the explicitly marked login and logout operations.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.example.invalid
  description: Placeholder; configure per environment
tags:
- name: Identity
  description: Registration, authentication, account lifecycle, and session management.
- name: Articles
  description: Public article retrieval and protected editorial lifecycle operations.
- name: Comments
  description: Reader comments, abuse reporting, moderation, and comment policy.
- name: Newsletter
  description: Subscription consent, preferences, delivery records, and provider callbacks.
- name: Search
  description: Full-text article search and topic or tag discovery.
- name: Sources
  description: Monitored X accounts, source records, exclusions, and compliance actions.
- name: Media
  description: Editorial image generation, approval, regeneration, and asset removal.
- name: Operations
  description: Health summaries, failed-event inspection, and controlled replay.
security:
- sessionCookie: []
- basicAuth: []
paths:
  "/api/v1/auth/csrf":
    get:
      tags:
      - Identity
      operationId: getCsrfToken
      summary: Issue the CSRF cookie and return its request-header value
      security: []
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CsrfTokenResponse"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/auth/register":
    post:
      tags:
      - Identity
      operationId: register
      summary: Register a local account requiring email verification
      security: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationRequest"
      responses:
        '201':
          description: Registration created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/login":
    post:
      tags:
      - Identity
      operationId: login
      summary: Authenticate using Spring Security form login
      security: []
      x-framework-provided: spring-security
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Authentication succeeded and a session was established
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/logout":
    post:
      tags:
      - Identity
      operationId: logout
      summary: Invalidate the current session using Spring Security logout
      x-framework-provided: spring-security
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '302':
          description: Session invalidated and redirected to the default logout-success
            URL
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              schema:
                type: string
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
      security: []
  "/api/v1/auth/verify-email":
    post:
      tags:
      - Identity
      operationId: verifyEmail
      summary: Consume a short-lived email-verification token
      security: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      responses:
        '204':
          description: Email verified
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/password-reset/request":
    post:
      tags:
      - Identity
      operationId: requestPasswordReset
      summary: Request a short-lived password-reset email
      security: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequest"
      responses:
        '202':
          description: Request accepted without account enumeration
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/password-reset/confirm":
    post:
      tags:
      - Identity
      operationId: confirmPasswordReset
      summary: Set a new password using a short-lived reset token
      security: []
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetConfirm"
      responses:
        '204':
          description: Password reset
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/auth/me":
    get:
      tags:
      - Identity
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfile"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
    patch:
      tags:
      - Identity
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserProfile"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
    delete:
      tags:
      - Identity
      operationId: deleteCurrentUser
      summary: Delete the authenticated account and invalidate its current session
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountDeletionRequest"
      responses:
        '204':
          description: Operation completed
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/auth/me/export":
    get:
      tags:
      - Identity
      operationId: exportCurrentUserData
      summary: Export the authenticated user's account data
      responses:
        '200':
          description: Account-data export
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for the JSON export
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountDataExport"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/auth/sessions":
    get:
      tags:
      - Identity
      operationId: listCurrentUserSessions
      summary: List sessions belonging to the authenticated user
      responses:
        '200':
          description: User sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/UserSession"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/auth/sessions/{sessionId}":
    delete:
      tags:
      - Identity
      operationId: revokeCurrentUserSession
      summary: Revoke one session belonging to the authenticated user
      parameters:
      - "$ref": "#/components/parameters/SessionId"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Operation completed
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/articles":
    get:
      tags:
      - Articles
      operationId: listLatestArticles
      summary: List the latest published articles
      security: []
      parameters:
      - "$ref": "#/components/parameters/ArticleLimit"
      responses:
        '200':
          description: Published articles
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Article"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/articles/{slug}":
    get:
      tags:
      - Articles
      operationId: getPublishedArticle
      summary: Get a published article by slug
      security: []
      parameters:
      - "$ref": "#/components/parameters/Slug"
      responses:
        '200':
          description: Published article
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Article"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles":
    post:
      tags:
      - Articles
      operationId: createManualArticle
      summary: Create a sourced article for editorial review
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArticleCommandRequest"
      responses:
        '201':
          description: Article created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IdResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}":
    get:
      tags:
      - Articles
      operationId: getAdminArticle
      summary: Get an article for editorial review
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Article"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
    put:
      tags:
      - Articles
      operationId: editArticle
      summary: Replace editable article content and return it to review
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/ExpectedVersion"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ArticleCommandRequest"
      responses:
        '204':
          description: Operation completed
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/approve":
    post:
      tags:
      - Articles
      operationId: approveArticle
      summary: Approve an article for publication workflow
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '202':
          description: Transition accepted
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/publish":
    post:
      tags:
      - Articles
      operationId: publishArticle
      summary: Publish an approved article immediately
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Transition applied
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/reject":
    post:
      tags:
      - Articles
      operationId: rejectArticle
      summary: Reject an article awaiting review
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Transition applied
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/unpublish":
    post:
      tags:
      - Articles
      operationId: unpublishArticle
      summary: Remove a published article from public surfaces
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Transition applied
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/restore":
    post:
      tags:
      - Articles
      operationId: restoreArticle
      summary: Restore an unpublished article
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Transition applied
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{id}/archive":
    post:
      tags:
      - Articles
      operationId: archiveArticle
      summary: Archive an unpublished or rejected article
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/CsrfToken"
      responses:
        '204':
          description: Transition applied
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/admin/articles/{articleId}/schedule":
    post:
      tags:
      - Articles
      operationId: scheduleArticle
      summary: Schedule an approved article for publication
      x-required-roles:
      - EDITOR
      - ADMINISTRATOR
      parameters:
      - "$ref": "#/components/parameters/ArticleId"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ScheduleRequest"
      responses:
        '202':
          description: Publication scheduled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScheduleResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/articles/{articleId}/comments":
    get:
      tags:
      - Comments
      operationId: listApprovedComments
      summary: List approved comments for an article
      security: []
      parameters:
      - "$ref": "#/components/parameters/ArticleId"
      responses:
        '200':
          description: Approved comments
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Comment"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
    post:
      tags:
      - Comments
      operationId: submitComment
      summary: Submit an authenticated comment for moderation
      parameters:
      - "$ref": "#/components/parameters/ArticleId"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommentRequest"
      responses:
        '202':
          description: Comment accepted for moderation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IdResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
        default:
          "$ref": "#/components/responses/UnexpectedError"
  "/api/v1/comments/{commentId}":
    put:
      tags:
      - Comments
      operationId: editOwnComment
      summary: Edit a comment during the configured author editing window
      parameters:
      - "$ref": "#/components/parameters/CommentId"
      - "$ref": "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:

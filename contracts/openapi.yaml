      operationId: phase4NewsletterRequestPreferenceLink
      summary: Queue a private management link without disclosing subscription existence
      description: >
        Returns the same response for unknown, pending, confirmed, unsubscribed and suppressed addresses. Only a
        confirmed subscription with a recorded verification timestamp can receive a link. Requests are
        normalized and serialized per subscription, with a ten-minute cooldown. A committed queue record is
        processed by the real configured SMTP transport; 202 does not claim delivery or verification. The
        HMAC-signed, preference-scoped authorization expires thirty minutes after the request and is bound to
        the confirmed consent. Uncertain SMTP submissions are recorded for reconciliation rather than
        automatically retried.

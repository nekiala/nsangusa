components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Redis-backed opaque Spring Session cookie
    basicAuth:
      type: http
      scheme: basic
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Identifier"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 250
    Topic:
      name: topic
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Tag:
      name: tag
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    SourceAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: "^[0-9]{1,30}$"
        maxLength: 30
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Spring Security CSRF token matching the XSRF-TOKEN cookie

    BadRequest:
      description: Invalid path, query, header, or request-body input
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required or failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: Authentication succeeded but authorization or CSRF validation failed
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Conflict:
      description: The requested transition conflicts with current resource state
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    TooManyRequests:
      description: Per-client request rate exceeded
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds
    ServiceUnavailable:
      description: Rate limiting could not reach its Redis dependency
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    UnexpectedError:
      description: Unexpected API failure
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"

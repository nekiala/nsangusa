  "/api/v1/articles/{articleId}/comments":
    get:
      tags:
      - Comments
      operationId: phase4CommunityPublicComments
      summary: Read visible comments and thread-preserving deletion markers
      description: >
        Returns an empty list when the article is unpublished or comments are disabled by the global, article, or
        per-article switch. Approved replies beneath pending, rejected, or spam parents are hidden. Deleted
        parents of visible replies are returned as tombstones. Does not expose other users' pending comments.
      security: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: Publicly visible comments, including applicable deletion markers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Phase4CommunityComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Article not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags:
      - Comments
      operationId: phase4CommunitySubmitComment
      summary: Submit an authenticated reader or staff comment
      description: >
        Requires an email-verified authenticated READER, MODERATOR, EDITOR, or ADMINISTRATOR with an unsuspended
        commenting privilege. The article must be published and all comment switches must permit posting. Body is
        trimmed plain text. A reply must target a nondeleted approved top-level comment on the same article; only
        one reply level is supported. Spam scoring and approval policy choose approved, pending, or spam state.
        Disabled commenting or a suspended commenting privilege returns 409; ineligible account roles return 403.
        Returns 202 regardless of the selected initial state. A supplied Idempotency-Key replays the same creation
        result without duplicate comments or submission events; omitting it retains legacy unkeyed execution.
      x-required-roles:
      - READER
      - MODERATOR
      - EDITOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/ArticleId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4CommunitySubmitRequest'
      responses:
        '202':
          description: Comment accepted; inspect the discussion for its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Article or reply parent not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/comments/{commentId}":
    put:
      tags:
      - Comments
      operationId: phase4CommunityEditOwnComment
      summary: Edit an owned comment within the configured editing window
      description: >
        Requires the authenticated comment author and an eligible account role. The comment must not be deleted,
        comments must currently be enabled for its published article, and commenting privilege must not be
        suspended. The editing deadline is exclusive: now must be before createdAt plus editingWindowMinutes. A
        zero-minute window disables edits. Editing rescans spam and reapplies approval policy, so an approved
        comment may return to pending or spam. Records a body-free audit event. expectedVersion is required; stale
        versions return 409. Successful keyed retries replay without repeating the edit, even if the edit window
        has since expired.
      x-required-roles:
      - READER
      - MODERATOR
      - EDITOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4CommunityEditRequest'
      responses:
        '204':
          description: Comment edited and rechecked against current moderation policy.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comment or article not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      tags:
      - Comments
      operationId: phase4CommunityDeleteOwnComment
      summary: Soft-delete an owned comment while preserving thread position
      description: >
        Requires the authenticated author and an eligible account role. Unlike editing, deletion is not restricted
        by the editing window, commenting suspension, or article availability. The text is replaced with a
        deletion marker and an audit event is recorded. An approved comment retains approved state as a tombstone;
        other states become deleted. The text cannot be restored. expectedVersion is required and checked even
        when the comment is already deleted. A keyed retry replays the original successful outcome without
        duplicate effects.
      x-required-roles:
      - READER
      - MODERATOR
      - EDITOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - name: expectedVersion
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Phase4CommunityExistingVersion'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Author deletion applied, or a matching successful command replayed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/comments/{commentId}/reports":
    post:
      tags:
      - Comments
      operationId: phase4CommunityReportComment
      summary: Report another account's visible comment
      description: >
        Requires an eligible authenticated reader or staff account. Reporting one's own comment is rejected with
        400. The comment and its article must currently be visible; deleted comments and replies beneath hidden
        parents cannot be reported. One report per comment and reporter is permitted. Duplicate unkeyed reports or
        reports on unavailable comments return 409. Reaching the configured open-report threshold moves an
        approved comment to pending. Creates an audit event. A matching Idempotency-Key replays the original
        report identifier without a second report. Commenting suspension does not remove the ability to report
        another account.
      x-required-roles:
      - READER
      - MODERATOR
      - EDITOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4CommunityReportRequest'
      responses:
        '202':
          description: Report recorded or its previous successful result replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comment or article not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'
  "/api/v1/admin/comments/{commentId}/moderate":
    post:
      tags:
      - Comments
      operationId: phase4CommunityModerateComment
      summary: Approve, reject, mark spam, or delete a comment with a reason
      description: >
        Requires MODERATOR or ADMINISTRATOR, including a fresh identity-module role check before idempotent
        replay. All decisions, including approval, require a nonblank reason and current expectedVersion. Persists
        moderation history and an audit event, and resolves all open reports for the comment. Deleted comments
        cannot be moderated again or resurrected. Moderator deletion replaces the text, marks state deleted, and
        preserves a tombstone when needed by visible replies. Approval does not bypass public article or
        global/per-article visibility rules.
      x-required-roles:
      - MODERATOR
      - ADMINISTRATOR
      security:
      - sessionCookie: []
      - basicAuth: []
      parameters:
      - $ref: '#/components/parameters/CommentId'
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phase4CommunityModerationRequest'
      responses:
        '204':
          description: Decision and audit persisted; open reports resolved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Comment not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

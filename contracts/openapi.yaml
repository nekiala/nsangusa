    put:
      tags: [Articles]
      operationId: saveAiProviderSetupDraft
      summary: Save an immutable bounded provider draft without activation or outbound calls
      description: Requires an existing prompt, operator-authorized model, and settings within deployment ceilings. Does not change the active configuration. Successful actor-key retries are not re-executed and return current redacted setup status.
      x-required-roles: [ADMINISTRATOR]

    Phase4AiCatalogIdentifier:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-zA-Z0-9._-]{1,100}$
    Phase4AiAuditReason:
      type: string
      minLength: 1
      maxLength: 500
      description: |
        Required nonblank audit reason, trimmed before storage. Java ISO control
        characters and recognizable OpenAI sk- credentials, PEM headers, and Bearer
        credentials are rejected. The nonblank pattern uses Java whitespace semantics.
      allOf:
      - pattern: ^[^\u0000-\u001F\u007F-\u009F]*$
      - pattern: '[^ \u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]'
      - not:
          pattern: \b[sS][kK]-[a-zA-Z0-9_-]{8,}|-----[bB][eE][gG][iI][nN]|\b[bB][eE][aA][rR][eE][rR]\s+
    Phase4AiGuidance:
      type: string
      minLength: 10
      maxLength: 4000
      description: |
        Plain-text editorial style guidance. At least 10 characters must remain after
        Java String.trim(); the server trims before storage. Tabs and LF are allowed;
        other ISO control characters, HTTP(S) URLs, recognizable OpenAI sk- credentials,
        PEM headers, and Bearer credentials are rejected. Must not be entirely Java
        whitespace. Server length limits count Java UTF-16 code units.
      allOf:
      - pattern: ^[^\u0000-\u0008\u000B-\u001F\u007F-\u009F]*$
      - pattern: ^[ \t\n]*[^ \t\n][\s\S]{8,}[^ \t\n][ \t\n]*$
      - pattern: '[^\u0009-\u000D\u001C-\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000]'
      - not:
          pattern: >-
            [hH][tT][tT][pP][sS]?://|\b[sS][kK]-[a-zA-Z0-9_-]{8,}|-----[bB][eE][gG][iI][nN]|\b[bB][eE][aA][rR][eE][rR]\s+

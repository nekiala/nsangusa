      properties:
        enabled:
          type: boolean
        requireApproval:
          type: boolean
        editingWindowMinutes:
          type: integer
          minimum: 0
          maximum: 10080
        reviewSpamThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Finite score threshold; never greater than rejectSpamThreshold.
        rejectSpamThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
        reportEscalationThreshold:
          type: integer
          minimum: 1
          maximum: 100
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Phase4CommunityOptionalRowVersion'
    Phase4CommunityGlobalPolicyRequest:
      type: object
      additionalProperties: false
      required:
      - reportEscalationThreshold
      - expectedVersion
      description: >
        Send the complete policy when updating. The Java record uses primitives for policy values: omission
        defaults booleans to false and numbers to 0. reportEscalationThreshold cannot be omitted because its
        default 0 fails its minimum constraint. expectedVersion is a required nonnull boxed integer.
        reviewSpamThreshold must not exceed rejectSpamThreshold.
      properties:
        enabled:
          type: boolean
          default: false
        requireApproval:
          type: boolean
          default: false
        editingWindowMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 0
        reviewSpamThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0
        rejectSpamThreshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0
        reportEscalationThreshold:
          type: integer
          minimum: 1
          maximum: 100
        expectedVersion:
          $ref: '#/components/schemas/Phase4CommunityOptionalRowVersion'
    Phase4CommunityArticlePolicy:
      type: object
      additionalProperties: false
      required:
      - articleId
      - enabledOverride
      - requireApprovalOverride
      - updatedAt
      - version
      properties:
        articleId:
          $ref: '#/components/schemas/Identifier'
        enabledOverride:
          type:
          - boolean
          - 'null'
          description: Null inherits; false disables; true still requires global/article switches and published state.
        requireApprovalOverride:
          type:
          - boolean
          - 'null'
          description: Null inherits global approval; otherwise overrides that default subject to spam checks.
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Phase4CommunityOptionalRowVersion'
    Phase4CommunityArticlePolicyRequest:
      type: object
      additionalProperties: false
      required:

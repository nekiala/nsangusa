      summary: Page through lightweight published article summaries
      description: >
        Queries authoritative article rows with state PUBLISHED and a non-null publishedAt. Ordering is
        publishedAt descending, then id ascending. No article body, editorial interior, source collection, or
        revision is fetched into this response. A valid page beyond the result set returns an empty items array

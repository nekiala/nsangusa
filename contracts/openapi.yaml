    Phase4NewsletterReconciliationRequest:
      type: object
      required:
      - outcome
      - evidenceReference
      properties:
        outcome:
          type: string
          enum:
          - provider_accepted
          - not_sent
          - abandoned
        evidenceReference:
          type: string
          minLength: 3
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/#-]{2,199}$
          description: Non-personal ticket or provider record reference; free-form email addresses are rejected.
        providerMessageId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
          pattern: ^[A-Za-z0-9<][A-Za-z0-9._@<>:/-]{0,199}$
          description: Optional except when asserting provider_accepted.
      allOf:
      - if:
          properties:
            outcome:
              const: provider_accepted
          required:
          - outcome
        then:
          required:
          - providerMessageId
          properties:
            providerMessageId:
              type: string
              minLength: 1

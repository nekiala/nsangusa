paths:
  /api/v1/auth/register:
    post:
      tags: [Identity]
      operationId: register
      summary: Request an account requiring email verification
      description: >
        Returns the same accepted response for a new or already registered address,
        without disclosing an account identifier. A new registration sends a real
        verification email. Existing accounts are not modified; use the verification
        request operation to request another verification link.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityRegistrationRequest'}
      responses:
        '202':
          description: Registration request accepted without disclosing account existence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityRegistrationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: Invalidate the current browser session without redirecting
      x-framework-provided: spring-security
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Current session invalidated; SESSION and JSESSIONID cookies removed.
          headers:
            Set-Cookie:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/verify-email:
    post:
      tags: [Identity]
      operationId: verifyEmail
      summary: Explicitly consume a single-use email-verification token
      description: >
        Only POST consumes the token. Missing, malformed, expired, previously consumed
        or wrong-purpose tokens are rejected. Token consumption is serialized in
        PostgreSQL. The default verification lifetime is 30 minutes and is configurable.
        Newsletter account linking occurs only after email verification.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityTokenRequest'}
      responses:
        '204': {description: Email verified.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/verification/request:
    post:
      tags: [Identity]
      operationId: requestIdentityVerification
      summary: Request a fresh verification link without disclosing account existence
      description: >
        Sends a link only for an enabled, non-deleted, unverified account. Previously
        issued verification tokens for that account are invalidated. The response
        does not reveal whether an eligible account exists.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityEmailRequest'}
      responses:
        '202': {description: Verification request accepted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/password-reset/request:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      summary: Request a short-lived password-reset email
      description: >
        Returns an accepted response without disclosing account existence. Only
        enabled, non-deleted accounts receive mail. Issuing a new token invalidates
        earlier reset tokens for the account. The default lifetime is 15 minutes
        and is configurable.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityEmailRequest'}
      responses:
        '202': {description: Password-reset request accepted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Identity]
      operationId: confirmPasswordReset
      summary: Explicitly consume a reset token and replace the password
      description: >
        Hashes the new password with the configured Argon2id encoder, clears login
        lockout tracking and revokes existing sessions after commit. A persistent
        security stamp prevents older authenticated sessions or a concurrent login
        using the old password from remaining authorized if Redis cleanup fails.
        GET does not consume the token.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityPasswordResetConfirm'}
      responses:
        '204': {description: Password replaced and previous authentication invalidated.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Read the currently authenticated account and its profile version
      description: Account identity is derived from the authenticated principal, never a supplied actor identifier.
      responses:
        '200':
          description: Current account; the response must not be publicly cached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityUserProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      summary: Update profile fields using the version actually loaded
      description: >
        Requires the current account version, including preference-only updates.
        Display names are trimmed and must remain nonblank. A newsletter frequency
        update requires an active linked subscription and does not grant consent
        or confirm a pending subscription. The legacy instant input is normalized
        to immediate. Stale versions return 409; successful changes are audited.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityProfileUpdate'}
      responses:
        '200':
          description: Updated current profile with its new version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityUserProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    delete:
      tags: [Identity]
      operationId: deleteCurrentUser
      summary: Confirm and anonymize the current account using its loaded version
      description: >
        Disables local sign-in, clears roles, anonymizes email and display name,
        removes verification/reset tokens and linked external identities, unsubscribes
        and unlinks the newsletter, and invalidates sessions. Required audit/consent
        records and published contributions may be retained; this is not a claim of
        cross-store or backup erasure. The last active administrator cannot delete
        their account. Deletion and administrator changes share a transaction lock.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityAccountDeletion'}
      responses:
        '204': {description: Account anonymized and sign-in invalidated.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/me/export:
    get:
      tags: [Identity]
      operationId: exportCurrentUserData
      summary: Download the current account's identity-data export
      description: >
        Includes the current profile, linked newsletter preference and external
        identity links. Does not contain password hashes or verification/reset
        tokens. Does not export published content, audit records or other modules'
        retained operational data. Export is audited.
      responses:
        '200':
          description: Scoped account-data export.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Content-Disposition:
              schema: {type: string, const: 'attachment; filename="account-data.json"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityAccountExport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/sessions:
    get:
      tags: [Identity]
      operationId: listCurrentUserSessions
      summary: List sessions indexed to the current account
      description: >
        Uses the Redis indexed session repository and sorts most recently accessed
        first. Marks the calling browser session as current. Session-store absence
        is an error, not an empty success response.
      responses:
        '200':
          description: Sessions belonging to the authenticated account.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Phase4IdentitySession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/auth/sessions/{sessionId}:
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserSession
      summary: Revoke one session owned by the current account
      description: >
        Rejects an unknown session or a session belonging to another account.
        Revoking the current session also invalidates the current servlet session.
        Successful revocation is audited.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': {description: Selected session revoked.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/admin/users:
    get:
      tags: [Identity]
      operationId: listIdentityUsers
      summary: Search and page user accounts for administration
      x-required-roles: [ADMINISTRATOR]
      description: >
        Requires administrator authorization and rechecks current database roles.
        Searches display name and email case-insensitively with literal substring
        matching; percent and underscore are not wildcard operators. Omitting
        status includes all non-deleted accounts. Ordering is createdAt descending,
        then id ascending.
      parameters:
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 100}
        - name: role
          in: query
          required: false
          schema: {$ref: '#/components/schemas/Phase4IdentityRole'}
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, unverified, disabled, deleted]
          description: active means enabled and verified; unverified means enabled but not verified.
        - name: page
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - $ref: '#/components/parameters/WorkspaceSize'
      responses:
        '200':
          description: Bounded user page.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityUserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/admin/users/{id}:
    get:
      tags: [Identity]
      operationId: getIdentityUser
      summary: Read an account's current administrative detail and version
      x-required-roles: [ADMINISTRATOR]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Current user detail.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Phase4IdentityAdminUser'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Account not found.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /api/v1/admin/users/{id}/roles:
    put:
      tags: [Identity]
      operationId: replaceIdentityUserRoles
      summary: Confirm a versioned replacement of another account's allowed roles
      x-required-roles: [ADMINISTRATOR]
      description: >
        Requires a durable actor-scoped request key, the loaded user version and an
        exact copy of the selected account's email as confirmation. Replaces the
        complete role set. Administrators cannot change their own roles. The target
        must be enabled, verified and non-deleted; the last active administrator
        cannot be removed. Actor identity comes from the authenticated principal.
        Authorization is rechecked before receipt lookup, including retries.
        Identical actor/key/target/version/payload retries return 204 without a second
        mutation or audit. Reusing the same key for a different payload returns 409. Role order is
        canonicalized before fingerprinting. Successful changes are audited, revoke
        target sessions after commit and change a persistent security stamp. Locally
        managed roles are not restored from external-provider claims on later login.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unlike legacy editorial operations, this operation requires a request key.
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[!-~]{8,200}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Phase4IdentityRoleChange'}
      responses:
        '204': {description: Roles replaced, or the same successful command replayed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Account not found.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

components:
  schemas:
    Phase4IdentityRole:
      type: string
      enum: [READER, MODERATOR, EDITOR, ADMINISTRATOR]

    Phase4IdentityVersion:
      type: integer
      format: int64
      minimum: 0

    Phase4IdentityRegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email, minLength: 1, maxLength: 320}
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          pattern: '\S'
        displayName: {type: string, minLength: 1, maxLength: 100, pattern: '\S'}

    Phase4IdentityRegistrationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: verification_required}

    Phase4IdentityEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, minLength: 1, maxLength: 320}

    Phase4IdentityToken:
      type: string
      writeOnly: true
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Opaque 256-bit unpadded base64url token delivered by email; only its SHA-256 hash is stored.

    Phase4IdentityTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {$ref: '#/components/schemas/Phase4IdentityToken'}

    Phase4IdentityPasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: {$ref: '#/components/schemas/Phase4IdentityToken'}
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          pattern: '\S'

    Phase4IdentityProfileUpdate:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          pattern: '\S'
        newsletterFrequency:
          type: [string, 'null']
          enum: [instant, immediate, daily, weekly, null]
          description: Null or omitted leaves frequency unchanged; instant is a legacy alias for immediate.
        expectedVersion: {$ref: '#/components/schemas/Phase4IdentityVersion'}

    Phase4IdentityAccountDeletion:
      type: object
      additionalProperties: false
      required: [confirmation, expectedVersion]
      properties:
        confirmation: {type: string, const: DELETE}
        expectedVersion: {$ref: '#/components/schemas/Phase4IdentityVersion'}

    Phase4IdentityNewsletterPreference:
      type: object
      additionalProperties: false
      required: [subscriptionId, status, frequency]
      properties:
        subscriptionId: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [pending, confirmed, unsubscribed, suppressed]}
        frequency:
          type: string
          description: Current stored newsletter frequency; profile writes use immediate, daily or weekly.

    Phase4IdentityUserProfile:
      type: object
      additionalProperties: false
      required: [id, email, displayName, roles, emailVerified, createdAt, lastLoginAt, newsletter, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, maxLength: 100}
        roles:
          type: array
          uniqueItems: true
          maxItems: 4
          items: {$ref: '#/components/schemas/Phase4IdentityRole'}
        emailVerified: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: [string, 'null'], format: date-time}
        newsletter:
          oneOf:
            - $ref: '#/components/schemas/Phase4IdentityNewsletterPreference'
            - type: 'null'
        version: {$ref: '#/components/schemas/Phase4IdentityVersion'}

    Phase4IdentityExternalIdentity:
      type: object
      additionalProperties: false
      required: [issuer, subject, emailAtLink, linkedAt, lastLoginAt]
      properties:
        issuer: {type: string, maxLength: 500}
        subject: {type: string, maxLength: 500}
        emailAtLink: {type: [string, 'null'], format: email, maxLength: 320}
        linkedAt: {type: string, format: date-time}
        lastLoginAt: {type: [string, 'null'], format: date-time}

    Phase4IdentityAccountExport:
      type: object
      additionalProperties: false
      required: [generatedAt, profile, externalIdentities]
      properties:
        generatedAt: {type: string, format: date-time}
        profile: {$ref: '#/components/schemas/Phase4IdentityUserProfile'}
        externalIdentities:
          type: array
          items: {$ref: '#/components/schemas/Phase4IdentityExternalIdentity'}

    Phase4IdentitySession:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastAccessedAt, expiresAt, current]
      properties:
        id: {type: string, description: Opaque session identifier, not an account identifier.}
        createdAt: {type: string, format: date-time}
        lastAccessedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        current: {type: boolean}

    Phase4IdentityAdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, roles, emailVerified, enabled, deletedAt, createdAt, lastLoginAt, version, rolesManagedLocally]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        email: {type: string, format: email, maxLength: 320}
        displayName: {type: string, maxLength: 100}
        roles:
          type: array
          uniqueItems: true
          maxItems: 4
          items: {$ref: '#/components/schemas/Phase4IdentityRole'}
        emailVerified: {type: boolean}
        enabled: {type: boolean}
        deletedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: [string, 'null'], format: date-time}
        version: {$ref: '#/components/schemas/Phase4IdentityVersion'}
        rolesManagedLocally:
          type: boolean
          description: External-provider role claims cannot add roles once local administration has taken ownership.

    Phase4IdentityUserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Phase4IdentityAdminUser'}
        page: {type: integer, minimum: 0, maximum: 100000}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}

    Phase4IdentityRoleChange:
      type: object
      additionalProperties: false
      required: [roles, expectedVersion, confirmation]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/Phase4IdentityRole'}
        expectedVersion: {$ref: '#/components/schemas/Phase4IdentityVersion'}
        confirmation:
          type: string
          minLength: 1
          maxLength: 320
          pattern: '\S'
          description: Must exactly equal the selected account's current email.

    Phase4IdentityCommunityUser:
      type: object
      additionalProperties: false
      required: [id, displayName, staff, active]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        displayName: {type: string, maxLength: 100}
        staff:
          type: boolean
          description: Has at least one moderator, editor or administrator role; no role list is disclosed.
        active:
          type: boolean
          description: Enabled, verified and not deleted.

    Phase4IdentityCommunityUserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/Phase4IdentityCommunityUser'}
        page: {type: integer, minimum: 0, maximum: 10000}
        size: {type: integer, minimum: 1, maximum: 20}
        total: {type: integer, format: int64, minimum: 0}

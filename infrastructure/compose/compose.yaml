name: nsangusa-dev

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [dev]

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [dev]

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        for topic in \
          news.ingestion.v1 news.ingestion.v1.retry news.ingestion.v1.dlt \
          news.editorial.v1 news.editorial.v1.retry news.editorial.v1.dlt \
          news.publication.v1 news.publication.v1.retry news.publication.v1.dlt \
          news.notifications.v1 news.notifications.v1.retry news.notifications.v1.dlt
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions 3 \
            --replication-factor 1
        done
    restart: "no"
    networks: [dev]

  redis:
    image: redis:8.10.0
    command: ["redis-server", "--appendonly", "no", "--save", "", "--protected-mode", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [dev]

  # SeaweedFS S3 gateway. Only the S3 port is published: the filer's unauthenticated HTTP API is
  # disabled and the master/volume ports stay on the compose network. Telemetry is off.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-filer.disableHttp", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-secret-key}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [dev]

  # Creates the private bucket with a signed S3 request; 409 means it already exists.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        status="$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
          --aws-sigv4 aws:amz:us-east-1:s3 --user "$${S3_ACCESS_KEY}:$${S3_SECRET_KEY}" \
          http://seaweedfs:9000/news-media)"
        case "$$status" in 200|409) echo "bucket news-media ready ($$status)" ;; *) echo "bucket creation failed: $$status" >&2; exit 1 ;; esac
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-local-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-secret-key}
    restart: "no"
    networks: [dev]

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [dev]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector.local.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [dev]

networks:
  dev:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  seaweedfs-data:
  mailpit-data:

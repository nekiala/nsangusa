          envFrom:
            - configMapRef:
                name: {{ include "nsangusa.fullname" . }}-frontend
          startupProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.probes.liveness | nindent 12 }}
          lifecycle:

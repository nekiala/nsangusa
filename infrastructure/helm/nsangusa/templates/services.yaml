apiVersion: v1
kind: Service
metadata:
  name: {{ include "nsangusa.fullname" . }}-backend
  labels:
    {{- include "nsangusa.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ default "ClusterIP" .Values.backend.service.type }}
  selector:
    {{- include "nsangusa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      appProtocol: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      {{- if and (eq (default "ClusterIP" .Values.backend.service.type) "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nsangusa.fullname" . }}-frontend
  labels:
    {{- include "nsangusa.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ default "ClusterIP" .Values.frontend.service.type }}
  selector:
    {{- include "nsangusa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      appProtocol: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if and (eq (default "ClusterIP" .Values.frontend.service.type) "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}

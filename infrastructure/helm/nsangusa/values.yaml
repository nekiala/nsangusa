nameOverride: ""
fullnameOverride: ""

monitoring:
  enabled: false
  runbookUrl: docs/reliability-operations.md
  # Separate internal listener; never add this port/path to the public ingress.
  port: 8081
  namespaceSelector:
    kubernetes.io/metadata.name: monitoring
  podSelector:
    app.kubernetes.io/name: prometheus
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    additionalLabels: {}
  grafana:
    # ConfigMap is always available when monitoring is enabled; no sidecar is assumed.
    sidecarLabel: ""

global:
  environment: development
  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

backendConfig:
  SPRING_PROFILES_ACTIVE: ""
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: ""
  DATABASE_URL: ""
  DATABASE_POOL_SIZE: "20"
  KAFKA_BOOTSTRAP_SERVERS: ""
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  REDIS_HOST: ""
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_SSL_ENABLED: "true"
  REDIS_CONNECT_TIMEOUT: 2s
  REDIS_COMMAND_TIMEOUT: 2s
  COOKIE_SECURE: "true"
  MAIL_HOST: ""
  MAIL_PORT: "587"
  MAIL_USERNAME: ""
  MAIL_SMTP_AUTH: "true"
  MAIL_STARTTLS_ENABLE: "true"
  MAIL_STARTTLS_REQUIRED: "true"
  PUBLIC_BASE_URL: ""
  PROVIDER_MODE: fake
  AI_BASE_URL: https://api.openai.com
  AI_MODEL: gpt-5-mini
  AI_LIVE_ENABLED: "false"
  AI_PROMPT_VERSION: editorial-v1
  AI_MAX_CONCURRENT_REQUESTS: "8"
  AI_MAX_ATTEMPTS: "3"
  AI_RETRY_INITIAL_DELAY: 250ms
  AI_RETRY_MAX_DELAY: 2s
  AI_CIRCUIT_FAILURE_THRESHOLD: "5"
  AI_CIRCUIT_OPEN_DURATION: 30s
  AI_INPUT_COST_PER_MILLION: "0"
  AI_OUTPUT_COST_PER_MILLION: "0"
  IMAGE_BASE_URL: https://api.openai.com
  IMAGE_MODEL: gpt-image-1
  S3_ENDPOINT: ""
  S3_REGION: us-east-1
  S3_BUCKET: news-media
  PUBLICATION_POLICY: HUMAN_REVIEW_ALWAYS
  AUTO_PUBLISH_CONFIDENCE: "0.95"
  AUTO_PUBLISH_TOPIC_RULES: ""
  STORY_CLUSTERING_WINDOW: PT6H
  STORY_SIMILARITY_THRESHOLD: "0.30"
  STORY_MAX_SOURCES: "10"
  STORY_QUIET_PERIOD: PT2M
  STORY_DISPATCH_INTERVAL: "30000"
  STORY_DISPATCH_BATCH_SIZE: "50"
  STORY_MAX_SOURCE_MATERIAL_CHARS: "40000"
  COMMENTS_ENABLED: "true"
  COMMENTS_REQUIRE_APPROVAL: "true"
  NEWSLETTER_FROM_ADDRESS: news@example.invalid
  NEWSLETTER_PROVIDER: local-smtp
  NEWSLETTER_IDEMPOTENCY_WINDOW: PT24H
  NEWSLETTER_ATTEMPT_LEASE: PT10M
  OIDC_ISSUER_URI: ""
  OIDC_CLIENT_ID: ""
  OIDC_SUCCESS_URL: /
  OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  OIDC_ROLES_CLAIM: roles
  X_API_BASE_URL: https://api.x.com
  X_RECONCILIATION_LIMIT: "100"

frontendConfig:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_API_URL: ""
  NEXT_PUBLIC_API_MODE: api

secret:
  existingSecret: ""
  env: {}
  # Expected keys include DATABASE_USERNAME, DATABASE_PASSWORD, AI_CREDENTIAL_MASTER_KEY,
  # IMAGE_API_KEY, S3_ACCESS_KEY, S3_SECRET_KEY, X_BEARER_TOKEN,
  # NEWSLETTER_TOKEN_SECRET, NEWSLETTER_WEBHOOK_SECRET, OIDC_CLIENT_SECRET
  # MAIL_PASSWORD, KAFKA_SASL_JAAS_CONFIG, and REDIS_PASSWORD.

backend:
  replicaCount: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  terminationGracePeriodSeconds: 45
  image:
    repository: example.invalid/nsangusa/backend
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 0
  pdb:
    enabled: false
    minAvailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  replicaCount: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  terminationGracePeriodSeconds: 30
  image:
    repository: example.invalid/nsangusa/frontend
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 80
    scaleDownStabilizationSeconds: 300
    scaleUpStabilizationSeconds: 0
  pdb:
    enabled: false
    minAvailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}

migration:
  enabled: false
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  args:
    - --spring.main.web-application-type=none
    - --spring.kafka.listener.auto-startup=false
    - --spring.task.scheduling.enabled=false
    - --management.tracing.enabled=false
    - --spring.main.lazy-initialization=true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: nsangusa.example.invalid
  backendPaths:
    - /api
    - /login
    - /logout
    - /oauth2
  tls:
    enabled: true
    secretName: nsangusa-tls

networkPolicy:
  enabled: true
  externalEgressManagedExternally: false
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  ingressPodSelector:
    app.kubernetes.io/name: ingress-nginx
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  backendExternalEgress: []
  frontendExternalEgress: []
  otelExternalEgress: []

otelCollector:
  enabled: true
  replicaCount: 2
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.132.0
    digest: ""
    pullPolicy: IfNotPresent
  exporter:
    endpoint: otlp.example.invalid:4317
    existingSecret: ""
    authorizationKey: OTEL_EXPORTER_OTLP_AUTHORIZATION
    insecure: false
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}

global:
  environment: production

secret:
  existingSecret: nsangusa-runtime
  env:
    DATABASE_USERNAME: DATABASE_USERNAME
    DATABASE_PASSWORD: DATABASE_PASSWORD
    KAFKA_SASL_JAAS_CONFIG: KAFKA_SASL_JAAS_CONFIG
    REDIS_PASSWORD: REDIS_PASSWORD
    MAIL_PASSWORD: MAIL_PASSWORD
    AI_CREDENTIAL_MASTER_KEY: AI_CREDENTIAL_MASTER_KEY
    IMAGE_API_KEY: IMAGE_API_KEY
    S3_ACCESS_KEY: S3_ACCESS_KEY
    S3_SECRET_KEY: S3_SECRET_KEY
    X_BEARER_TOKEN: X_BEARER_TOKEN
    NEWSLETTER_TOKEN_SECRET: NEWSLETTER_TOKEN_SECRET
    NEWSLETTER_WEBHOOK_SECRET: NEWSLETTER_WEBHOOK_SECRET
    OIDC_CLIENT_SECRET: OIDC_CLIENT_SECRET

backendConfig:
  SPRING_PROFILES_ACTIVE: production,oidc
  PROVIDER_MODE: production
  AI_LIVE_ENABLED: "true"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  NEWSLETTER_PROVIDER: resend
  COOKIE_SECURE: "true"

migration:
  enabled: true

backend:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2

frontend:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
  pdb:
    enabled: true
    minAvailable: 2

ingress:
  enabled: true
  tls:
    enabled: true

networkPolicy:
  enabled: true

global:
  environment: staging

secret:
  existingSecret: nsangusa-runtime
  env:
    DATABASE_USERNAME: DATABASE_USERNAME
    DATABASE_PASSWORD: DATABASE_PASSWORD
    KAFKA_SASL_JAAS_CONFIG: KAFKA_SASL_JAAS_CONFIG
    REDIS_PASSWORD: REDIS_PASSWORD
    S3_ACCESS_KEY: S3_ACCESS_KEY
    S3_SECRET_KEY: S3_SECRET_KEY

backendConfig:
  SPRING_PROFILES_ACTIVE: staging
  PROVIDER_MODE: fake
  COOKIE_SECURE: "true"

migration:
  enabled: true

backend:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  pdb:
    enabled: true

frontend:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
  pdb:
    enabled: true

ingress:
  enabled: true

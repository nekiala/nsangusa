global:
  environment: test

secret:
  existingSecret: nsangusa-test-runtime
  env:
    DATABASE_USERNAME: DATABASE_USERNAME
    DATABASE_PASSWORD: DATABASE_PASSWORD
    KAFKA_SASL_JAAS_CONFIG: KAFKA_SASL_JAAS_CONFIG
    REDIS_PASSWORD: REDIS_PASSWORD
    S3_ACCESS_KEY: S3_ACCESS_KEY
    S3_SECRET_KEY: S3_SECRET_KEY

backendConfig:
  SPRING_PROFILES_ACTIVE: test
  PROVIDER_MODE: fake
  COOKIE_SECURE: "true"

migration:
  enabled: true

backend:
  replicaCount: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false

frontend:
  replicaCount: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false

ingress:
  enabled: true

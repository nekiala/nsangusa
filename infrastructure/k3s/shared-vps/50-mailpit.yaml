# Mail sink: the test environment never delivers email to real recipients. Open the inbox with
#   kubectl -n nsangusa-test-data port-forward svc/mailpit 8025:8025
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: nsangusa-test-data
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: nsangusa-test-data
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        nsangusa.io/data-service: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
          env:
            - {name: MP_MAX_MESSAGES, value: "500"}
            - {name: MP_DATABASE, value: /data/mailpit.db}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}

# Redis over TLS only (plaintext port disabled). Sessions, rate limits and cache are disposable,
# so persistence stays off exactly as in the local stack.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nsangusa-test-data
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nsangusa-test-data
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        nsangusa.io/data-service: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:8.10.0@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: REDIS_PASSWORD}}
            - name: REDISCLI_AUTH
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: REDIS_PASSWORD}}
          # The password goes in through stdin config, never the process arguments.
          command:
            - sh
            - -ec
            - |
              printf 'requirepass %s\n' "$REDIS_PASSWORD" | exec redis-server - \
                --port 0 --tls-port 6379 \
                --tls-cert-file /tls/tls.crt --tls-key-file /tls/tls.key \
                --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no \
                --tls-protocols "TLSv1.2 TLSv1.3" \
                --appendonly no --save "" --dir /data
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, --tls, --cacert, /tls/ca.crt, -h, 127.0.0.1, ping]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: tls
          secret: {secretName: redis-tls, defaultMode: 0440}

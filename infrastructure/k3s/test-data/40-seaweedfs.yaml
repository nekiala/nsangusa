# SeaweedFS S3 gateway over TLS from the test CA. SSE-S3 is enabled with a key from the
# credentials Secret, so the application's default AES256 requests are encrypted at rest. The
# filer's unauthenticated HTTP API is disabled and only the S3 port is exposed; telemetry is off.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: nsangusa-test-data
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: nsangusa-test-data
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        nsangusa.io/data-service: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          args:
            - server
            # Master, volume and filer stay on loopback; only the S3 gateway listens on the pod IP.
            # Its auxiliary listeners are not admitted by the namespace NetworkPolicy (9000 only).
            - -ip=127.0.0.1
            - -s3.ip.bind=0.0.0.0
            - -dir=/data
            - -s3
            - -s3.port=9000
            - -s3.cert.file=/tls/tls.crt
            - -s3.key.file=/tls/tls.key
            - -filer.disableHttp
            - -master.telemetry=false
            - -master.volumeSizeLimitMB=1024
            - -volume.max=16
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: S3_ACCESS_KEY}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: S3_SECRET_KEY}}
            - name: WEED_S3_SSE_KEY
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: S3_SSE_KEY}}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /healthz, port: s3, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: s3, scheme: HTTPS}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: seaweedfs-tls, defaultMode: 0440}
        # Embedded master, volume and filer communicate over unix sockets in /tmp.
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path-retain
        resources:
          requests: {storage: 20Gi}
---
# Creates the private bucket with a signed request, verifying the server against the test CA.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket
  namespace: nsangusa-test-data
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        nsangusa.io/setup: "true"
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bucket
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          env:
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: test-data-credentials, key: S3_SECRET_KEY}}
          command:
            - sh
            - -ec
            - |
              status="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
                --cacert /ca/ca.crt \
                --aws-sigv4 aws:amz:us-east-1:s3 --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
                https://seaweedfs.nsangusa-test-data.svc:9000/news-media)"
              case "$status" in
                200|409) echo "bucket news-media ready ($status)" ;;
                *) echo "bucket creation failed: $status" >&2; exit 1 ;;
              esac
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ca, mountPath: /ca, readOnly: true}
      volumes:
        - name: ca
          secret: {secretName: seaweedfs-tls, items: [{key: ca.crt, path: ca.crt}]}

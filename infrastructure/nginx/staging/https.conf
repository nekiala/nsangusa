server {
    listen 80;
    server_name staging.nsangusa.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nsangusa-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / {
        return 308 https://staging.nsangusa.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.nsangusa.com;
    server_tokens off;

    ssl_certificate /etc/nsangusa-acme/live/staging.nsangusa.com/fullchain.pem;
    ssl_certificate_key /etc/nsangusa-acme/live/staging.nsangusa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:nsangusa_staging_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        default_type text/plain;
        return 503 "Nsangusa staging is not yet deployed.\n";
    }
}

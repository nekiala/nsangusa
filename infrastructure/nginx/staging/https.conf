server {
    listen 80;
    server_name staging.nsangusa.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nsangusa-acme;
        default_type text/plain;
        try_files $uri =404;
        limit_except GET { deny all; }
    }

    location / {
        return 308 https://staging.nsangusa.com$request_uri;
    }
}

# The `test` environment (k3s namespace nsangusa-test) behind a shared basic-auth boundary.
# Routing mirrors the chart's Ingress: backendPaths go to the backend, everything else to the
# frontend, both through loopback-only NodePorts.
server {
    listen 443 ssl;
    server_name staging.nsangusa.com;
    server_tokens off;

    ssl_certificate /etc/nsangusa-acme/live/staging.nsangusa.com/fullchain.pem;
    ssl_certificate_key /etc/nsangusa-acme/live/staging.nsangusa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:nsangusa_staging_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Server-level headers apply to every proxied response; locations below add none, so these
    # are inherited. The application owns Cache-Control for its own responses.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    auth_basic "Nsangusa test environment";
    auth_basic_user_file /etc/nginx/nsangusa-test.htpasswd;

    client_max_body_size 10m;

    # The proxy's credentials are for this boundary only; the application uses session cookies.
    # Overwrite forwarding headers so clients cannot inject addresses the rate limiter trusts.
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        return 404;
    }

    location ~ ^/(api|login|logout|oauth2)(/|$) {
        proxy_pass http://127.0.0.1:30381;
    }

    location / {
        proxy_pass http://127.0.0.1:30380;
    }

    error_page 502 503 504 @unavailable;
    location @unavailable {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 "Nsangusa test environment is unavailable.\n";
    }
}

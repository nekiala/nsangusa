# Mount the chart's operational-rules ConfigMap at /etc/nsangusa.
# This file is an opt-in example, not an installed Prometheus/Alertmanager deployment.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/nsangusa/nsangusa-rules.yaml
scrape_configs:
  - job_name: nsangusa-backend
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    honor_labels: false
    static_configs:
      - targets: ["nsangusa-metrics.REVIEWED_NAMESPACE.svc:8081"]
        labels:
          namespace: REVIEWED_NAMESPACE
# Replace static service discovery with endpoint/pod discovery before using >1 replica.
# Configure approved Alertmanager routing separately; do not embed credentials here.
